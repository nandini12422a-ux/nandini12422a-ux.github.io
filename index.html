  <!-- NORMAL HTML FORM -->

  <h2>Normal HTML Form</h2>

  <form id="practiceForm">

    <input
      type="text"
      name="name"
      placeholder="Your Name"
      required
    >

    <br><br>

    <input
      type="email"
      name="email"
      placeholder="Your Email"
      required
    >

    <br><br>

    <button type="submit">
      Submit
    </button>

  </form>

  <!-- NORMAL FORM REDIRECT SCRIPT -->

  <script>
    document.getElementById("practiceForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        // Practice form only.
        // No personal information is sent in the URL.
        // This does not save the submitted lead.

        window.location.href = "thankyou.html";

      });
  </script>
